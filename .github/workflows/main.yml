name: Build OHA iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Télécharger le code du dépôt
        uses: actions/checkout@v4

      - name: Compiler l’application iOS
        run: |
          xcodebuild \
            -project OHAApp.xcodeproj \
            -scheme OHA \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Créer le paquet IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OHA.app Payload/
          zip -r OHA-unsigned.ipa Payload

      - name: Publier le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: OHA-unsigned-IPA
          path: OHA-unsigned.ipa
